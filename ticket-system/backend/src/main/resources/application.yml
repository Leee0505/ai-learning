spring:
  application:
    name: ticket-system
  profiles:
    active: dev
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  kafka:
    bootstrap-servers: placeholder-will-be-overridden-by-profile
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      # ── Reliability: idempotent producer (no duplicates from retries) ──
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5
    consumer:
      group-id: ticket-system
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.trusted.packages: "com.ticket.event"
      # ── Reliability: manual ack after record processed ──
      enable-auto-commit: false
      max-poll-records: 50
    listener:
      missing-topics-fatal: false
      ack-mode: record

server:
  port: 8080

# ── Actuator (external monitoring, Docker healthcheck) ──
management:
  endpoints:
    web:
      exposure:
        include: health,metrics
      base-path: /actuator
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true
  health:
    kafka:
      enabled: false   # skip on /actuator/health/liveness (kafka may be down in dev)
    redis:
      enabled: true

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    db-config:
      id-type: auto

rate-limit:
  max-requests-per-minute: 10

jwt:
  access-token-expiration: 7200000
  refresh-token-expiration: 604800000

file:
  upload:
    max-size: 10485760
